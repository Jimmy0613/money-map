plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.moneymap'
version = '0.1.0'
// Security patch versions within the existing framework and servlet generations.
ext['tomcat.version'] = '10.1.61'
ext['jackson-bom.version'] = '2.21.8'
ext['postgresql.version'] = '42.7.14'
ext['log4j2.version'] = '2.25.5'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.9'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform { excludeTags 'integration', 'performance' } }
tasks.register('integrationTest', Test) {
    description = 'Requires Docker; executes real PostgreSQL integration tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    shouldRunAfter test
}

tasks.register('performanceTest', Test) {
    description = 'Isolated PostgreSQL + HTTP: 10 users, 10000 rows each, 60s warmup + 300s measurement.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'performance' }
    maxHeapSize = '1g'
}
