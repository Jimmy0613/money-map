server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/money_map}
    username: ${SPRING_DATASOURCE_USERNAME:money_map}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
app:
  demo:
    emails: ${APP_DEMO_EMAILS:}
    max-created-transactions: ${APP_DEMO_MAX_CREATED_TRANSACTIONS:200}
    max-categories: ${APP_DEMO_MAX_CATEGORIES:40}
    max-sessions: ${APP_DEMO_MAX_SESSIONS:10}
    max-session-tokens: ${APP_DEMO_MAX_SESSION_TOKENS:60}
  traffic:
    requests-per-minute: ${APP_REQUESTS_PER_MINUTE:300}
    mutations-per-minute: ${APP_MUTATIONS_PER_MINUTE:60}
  access:
    restricted: ${APP_ACCESS_RESTRICTED:false}
    signup-enabled: ${APP_SIGNUP_ENABLED:true}
    allowed-emails: ${APP_ALLOWED_EMAILS:}
  recovery-required: ${APP_RECOVERY_REQUIRED:false}
  recovery:
    authority-url: ${RECOVERY_AUTHORITY_URL:}
    authority-token: ${RECOVERY_AUTHORITY_TOKEN:}
    timeout-ms: ${RECOVERY_AUTHORITY_TIMEOUT_MS:750}
    public-key: ${RECOVERY_AUTHORITY_PUBLIC_KEY:}
    environment: ${RECOVERY_ENVIRONMENT:}
    deployment: ${RECOVERY_DEPLOYMENT:}
  origin: ${APP_ORIGIN:http://localhost:3000}
  jwt-secret: ${JWT_SECRET}
  cursor-secret: ${CURSOR_SECRET}
  cookie-secure: ${AUTH_COOKIE_SECURE:true}
logging:
  level:
    org.springframework.web: WARN
